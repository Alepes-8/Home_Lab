# prometheus/rules/homelab.yml
groups:
  - name: homelab
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Target {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been unreachable for more than 2 minutes."