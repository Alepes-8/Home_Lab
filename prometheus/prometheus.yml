global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'drink-api-prod'
    metrics_path: /drink/metrics
    static_configs:
      - targets: ['homesystem.local:80']
        labels:
          env: production

  - job_name: 'drink-api-staging'
    metrics_path: /drink/metrics
    static_configs:
      - targets: ['staging.local:80']
        labels:
          env: staging