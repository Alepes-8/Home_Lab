global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Scrape configurations
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'drink_api_prod'
    static_configs:
      - targets: ['192.168.1.30:80']
    metrics_path: '/metrics'
    params:
      host: ['homesystem.local']

  - job_name: 'drink_api_staging'
    static_configs:
      - targets: ['192.168.1.30:80']
    metrics_path: '/metrics'
    params:
      host: ['staging.local']