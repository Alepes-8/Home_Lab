version: "3.8"

services:
  mongo-prod-database:
    image: mongo:latest
    container_name: mongo-prod
    networks:
      - homelab-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - mongo-prod-data:/data/db

  drink_api_prod:
    env_file:
      - .env.prod
    networks:
      - homelab-network
    volumes:
      - /var/log/homelab/drink_api:/var/log/homelab/drink_api
    depends_on:
      mongo-prod-database:
        condition: service_healthy
    container_name: drink_api_prod
    image: ghcr.io/alepes-8/drink_api_home_lab:${IMAGE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-5001}/drink/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "${PORT:-5001}:${PORT:-5001}"

volumes:
  mongo-prod-data:

networks:
  homelab-network:
    external: true