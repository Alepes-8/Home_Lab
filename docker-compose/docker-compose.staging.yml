version: "3.8"

services:
  mongo-staging-database:
    image: mongo:latest
    container_name: mongo-staging
    networks:
      - homelab-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - mongo-staging-data:/data/db

  drink_api_staging:
    env_file:
      - /home/homelab/Home_Lab/docker-compose/.env.staging
    networks:
      - homelab-network
    volumes:
      - /var/log/homelab/drink_api:/var/log/homelab/drink_api
    depends_on:
      mongo-staging-database:
        condition: service_healthy
    container_name: drink_api_staging
    image: ghcr.io/alepes-8/drink_api_home_lab:${IMAGE_TAG:-staging}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-5002}/drink/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "${PORT:-5002}:${PORT:-5002}"

volumes:
  mongo-staging-data:

networks:
  homelab-network:
    external: true  # tells compose this network already exists, don't create it
