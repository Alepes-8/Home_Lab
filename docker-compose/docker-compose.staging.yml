version: "3.8"

services:
  mongo-staging-database:
    image: mongo:latest
    container_name: mongo-staging
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - mongo-staging-data:/data/db

  drink_api_staging:
    env_file:
      - .env.staging
    networks:
      - homelab-network
    depends_on:
      mongo-staging-database:
        condition: service_healthy
    container_name: drink_api_staging
    image: ghcr.io/alepes-8/drink_api_home_lab:${IMAGE_TAG:-latest}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-5002}/drink/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "${PORT:-5002}:${PORT:-5002}"
    environment:
      - PORT=${PORT:-5002}
      - MONGO_URI=${MONGO_URI:-dummy}
      - JWT_SECRET=${JWT_SECRET:-dummy}
      - APP_ADMIN_USERNAME=${APP_ADMIN_USERNAME:-dummy}
      - APP_ADMIN_PASSWORD=${APP_ADMIN_PASSWORD:-dummy}

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - drink_api_staging

volumes:
  mongo-staging-data:

networks:
  homelab-network:
    external: true  # tells compose this network already exists, don't create it
