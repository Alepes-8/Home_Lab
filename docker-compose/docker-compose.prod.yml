version: "3.8"

networks:
  homelab-network:
    external: true  # tells compose this network already exists, don't create it

services:
  mongo-prod-database:
    image: mongo:latest
    container_name: mongo-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - mongo-prod-data:/data/db

  drink_api_prod:
    networks:
      - homelab-network
    depends_on:
      mongo-prod-database:
        condition: service_healthy
        networks:
          - homelab-network
    container_name: drink_api_prod
    image: ghcr.io/alepes-8/drink_api_home_lab:${IMAGE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-5001}/drink/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "${PORT:-5001}:${PORT:-5001}"
    environment:
      - PORT=${PORT:-5001}
      - MONGO_URI=${MONGO_URI:-dummy}
      - JWT_SECRET=${JWT_SECRET:-dummy}
      - APP_ADMIN_USERNAME=${APP_ADMIN_USERNAME:-dummy}
      - APP_ADMIN_PASSWORD=${APP_ADMIN_PASSWORD:-dummy}

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - drink_api_prod

volumes:
  mongo-prod-data:

networks:
  homelab-network:
    external: true